<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -16 330 136" fill="none">
  <defs>
    <linearGradient id="cakebg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff9fc"/>
      <stop offset="1" stop-color="#ffe6f0"/>
    </linearGradient>
  </defs>
  <!-- example bubble: same length as every other cover (3..317 x 3..99) -->
  <rect x="3" y="3" width="314" height="96" rx="10" fill="url(#cakebg)" stroke="#ff9ec7" stroke-width="2"/>
  <circle cx="46" cy="28" r="3" fill="#ffd166"/>
  <circle cx="66" cy="40" r="3" fill="#7ee8c7"/>
  <circle cx="52" cy="44" r="3" fill="#7aa8ff"/>
  <circle cx="180" cy="30" r="3" fill="#ffd166"/>
  <circle cx="240" cy="46" r="3" fill="#7ee8c7"/>
  <circle cx="120" cy="52" r="3" fill="#7aa8ff"/>
  <!-- cake badge straddling the top-left corner, half past each edge -->
  <ellipse cx="3" cy="-12" rx="3.5" ry="3.8" fill="#ffd166"/>
  <ellipse cx="3" cy="-10.5" rx="1.7" ry="2.3" fill="#ff8c42"/>
  <rect x="0.5" y="-10" width="5.5" height="16" rx="1.5" fill="#ff4d94"/>
  <rect x="-7.5" y="6" width="21" height="6" fill="#ffffff"/>
  <circle cx="-3" cy="12" r="3" fill="#ffffff"/>
  <circle cx="9" cy="12" r="3" fill="#ffffff"/>
  <rect x="-7.5" y="12" width="21" height="9" rx="1" fill="#ff8fc0"/>
  <rect x="-10" y="21" width="26" height="3.5" rx="1.75" fill="#f4b93c"/>
  <text x="3" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#ffffff" stroke="#d63384" stroke-width="0.4">1</text>
</svg>
