name: Build Chromebook and Windows apps

on:
  push:
    branches: [main]
    paths:
      - 'android/app/build.gradle'
      - 'desktop/windows/**'
      - 'public/install/index.html'
      - '.github/workflows/platform-release.yml'
      - 'server/index.js'
      - 'public/assets/js/main.js'
      - 'public/assets/css/style.css'
      - 'public/index.html'
      - 'public/manifest.webmanifest'

permissions:
  contents: write

jobs:
  chromebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Build APK
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../JimmyQrg-Chat-Android-Chromebook.apk
      - uses: actions/upload-artifact@v4
        with:
          name: chromebook-apk
          path: JimmyQrg-Chat-Android-Chromebook.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/windows/package-lock.json
      - name: Install packaging dependencies
        working-directory: desktop/windows
        run: npm ci
      - name: Build Windows installer
        working-directory: desktop/windows
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: desktop/windows/dist/JimmyQrg-Chat-Windows-Setup.exe
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [chromebook, windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chromebook-apk
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7-platforms
          target_commitish: main
          name: JimmyQrg Chat — Chromebook and Windows
          body: |
            JimmyQrg Chat v1.7 desktop and Chromebook packages.

            - Chromebook: Android APK for Chromebooks with Android app support. ChromeOS devices that restrict APK sideloading can install the web app from Chrome instead.
            - Windows: x64 setup installer. It opens the live JimmyQrg Chat service in its own desktop window.
          files: |
            dist/JimmyQrg-Chat-Android-Chromebook.apk
            dist/JimmyQrg-Chat-Windows-Setup.exe
          overwrite_files: true
